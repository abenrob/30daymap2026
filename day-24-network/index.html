<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Hour on Berlin Transit</title>
<meta name="description" content="Every street you can reach within an hour of public transit from Alexanderplatz, growing outward minute by minute.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>
<a class="back ui" href="../">‹ 30 Day Map Challenge 2026</a>

<section class="title">
  <div class="kicker">Day 24 · Network</div>
  <h1>One hour on Berlin transit</h1>
  <p class="dek" id="dek">From Alexanderplatz, Tuesday 08:00</p>
</section>

<section class="clock">
  <div class="min"><span id="min">0</span><small>min</small></div>
  <div class="ramp"><i id="ramp-head"></i></div>
  <div class="ticks"><span>0</span><span>30</span><span>60</span></div>
</section>

<div class="controls ui">
  <button id="play">Pause</button>
  <button id="restart">Restart</button>
</div>
<div class="credit">Travel times © Targomo · Basemap © CARTO, © OpenStreetMap contributors</div>
<div class="loading" id="loading">Loading network…</div>

<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@8.9.36/dist.min.js"></script>
<script src="app.js"></script>
</body>
</html>
